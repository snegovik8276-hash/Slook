name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Разложить файлы по папкам
        run: |
          for f in *__*; do
            [ -f "$f" ] || continue
            d="$(echo "$f" | sed 's/__/\//g')"
            mkdir -p "$(dirname "$d")"
            git mv "$f" "$d"
          done
          if ! git diff --cached --quiet; then
            git config user.name slook-bot
            git config user.email bot@users.noreply.github.com
            git commit -m "Файлы разложены по папкам"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SLOOK-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
